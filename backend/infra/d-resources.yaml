# Role D resources, ready to paste under `Resources:` in backend/template.yaml (E1).
#
# Assumes the template defines these; rename the !Ref / !GetAtt targets if E used other names:
#   Table            the DynamoDB single table
#   DocumentsBucket  S3 documents bucket (Object Lock)
#   ExportsBucket    S3 exports bucket
#   HttpApi          the AWS::Serverless::HttpApi with the Cognito authorizer
#
# CodeUri is backend/ (where template.yaml lives) because the code imports
# `shared.*` and `functions.*` from there. backend/requirements.txt adds the
# anthropic SDK for Ask.

  # ---------- D8: Bedrock Guardrail for Ask your books ----------
  AskGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: ledgerline-ask
      Description: Keeps Ask your books on the practice's own finances and masks personal information.
      BlockedInputMessaging: >-
        I can only answer questions about your practice's own books, like revenue,
        expenses, payouts and bills. I can't give investment advice.
      BlockedOutputsMessaging: >-
        I can't share that answer. Try asking about a specific period, account or vendor.
      TopicPolicyConfig:
        TopicsConfig:
          - Name: InvestmentAdvice
            Type: DENY
            Definition: >-
              Recommendations or opinions about buying, selling or holding securities, funds,
              annuities or other investments, or about how a client should allocate or manage
              their portfolio.
            Examples:
              - Which stocks should my clients buy right now?
              - Should I move my clients out of bond funds?
              - Is this annuity a good investment for a retiree?
              - What's the best ETF to recommend this quarter?
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE   # prompt-attack filtering only applies to input
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: HATE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
      SensitiveInformationPolicyConfig:
        # Person names are left alone on purpose: answers need vendor and staff names.
        PiiEntitiesConfig:
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: ANONYMIZE }
          - { Type: US_BANK_ACCOUNT_NUMBER, Action: ANONYMIZE }
          - { Type: US_BANK_ROUTING_NUMBER, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE }
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: ADDRESS, Action: ANONYMIZE }
          - { Type: US_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER, Action: ANONYMIZE }

  AskGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt AskGuardrail.GuardrailId
      Description: Demo version

  # ---------- D2/D3/D7: GET /financials ----------
  FinancialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.financials.handler.financials_handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /financials, Method: GET }

  # ---------- D4: GET /revenue/reconciliation ----------
  ReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.financials.handler.reconciliation_handler
      Runtime: python3.12
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /revenue/reconciliation, Method: GET }

  # ---------- D5: POST /ask ----------
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.ask.handler.lambda_handler
      Runtime: python3.12
      Timeout: 60          # model call; API Gateway HTTP APIs cap at 30s, see note below
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ASK_MODEL_ID: anthropic.claude-opus-5-5
          GUARDRAIL_ID: !GetAtt AskGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt AskGuardrailVersion.Version
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt AskGuardrail.GuardrailArn
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /ask, Method: POST }

  # ---------- D6: POST /export ----------
  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.export.handler.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          EXPORTS_BUCKET: !Ref ExportsBucket
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocumentsBucket }
        - S3CrudPolicy: { BucketName: !Ref ExportsBucket }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /export, Method: POST }

# Note on /ask timing: HTTP APIs time out at 30 seconds. Ask runs at medium effort
# with a short context, which should fit; if it doesn't in testing, lower effort to
# "low" in functions/ask/bedrock.py before anything else.
